spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        batch_size: 100
        dialect: org.hibernate.dialect.PostgreSQLDialect
        auto: false
        ddl-auto: none
        naming-strategy: org.hibernate.boot.model.naming.JavaxMappingStrategy
        drop-tables: false

server:
  servlet:
    port: 8080
  tomcat:
    uri-encoding: UTF-8

logging:
  level:
    root: INFO
    org.gotson.komga: DEBUG
