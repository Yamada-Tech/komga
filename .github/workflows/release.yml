name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-2404
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up WebUI
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: Build WebUI
        run: npm run build
        working-directory: komga-webui
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Copy WebUI into backend resources
        run: chmod +x gradlew && ./gradlew :komga:webuiCopyDist :komga:webuiCopyIndex

      - name: Build jar with Gradle
        run: ./gradlew :komga:bootJar -x test

      - name: Verify jar contents
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          JAR="komga/build/libs/komga-${VERSION}.jar"
          test -f "$JAR" || { echo "jar not found: $JAR"; exit 1; }
          unzip -l "$JAR" > jar-listing.txt
          for entry in 'BOOT-INF/classes/public/index.html' 'BOOT-INF/classes/application.yml'; do
            grep -q "$entry" jar-listing.txt || { echo "missing jar entry: $entry"; exit 1; }
          done
          echo "jar OK ($(du -h "$JAR" | cut -f1))"

      - name: Stage jar for release
        id: prep
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          cp "komga/build/libs/komga-${VERSION}.jar" "komga-${VERSION}.jar"
          echo "jar=komga-${VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prep.outputs.jar }}
          generate_release_notes: true
          fail_on_unmatched_files: true
