name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build -x test

      - name: Create release
        run: |
          cd komga
          git tag -a v${GITHUB_REF#refs/tags/} -m 'Release'
          git push origin v${GITHUB_REF#refs/tags/}

      - name: Upload to GitHub Releases
        uses: actions/upload-release-asset@v4
        with:
          upload_url: ${{steps.release.outputs.upload_url}}
          asset_path: komga/target/komga-0.0.1-SNAPSHOT.jar
          asset_name: komga-0.0.1-SNAPSHOT.jar
          asset_content_type: application/java-archive
