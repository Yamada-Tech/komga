name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up WebUI
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: Build WebUI
        run: npm run build
        working-directory: komga-webui

      - name: Copy WebUI into backend resources
        run: chmod +x gradlew && ./gradlew webuiCopyDist webuiCopyIndex

      - name: Build with Gradle
        run: ./gradlew :komga:bootJar -x test

      - name: Stage jar for release
        id: prep
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          cp "komga/build/libs/komga-${VERSION}.jar" "komga-${VERSION}.jar"
          echo "jar=komga-${VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.prep.outputs.jar }}
          generate_release_notes: true
          fail_on_unmatched_files: true
