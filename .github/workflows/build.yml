name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-2404
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up WebUI
        uses: ./.github/actions/setup-web
        with:
          working-directory: komga-webui

      - name: Build WebUI
        run: npm run build
        working-directory: komga-webui
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Copy WebUI into backend resources
        run: ./gradlew :komga:webuiCopyDist :komga:webuiCopyIndex

      - name: Build with Gradle (compile + ktlint + unit tests + bootJar)
        run: ./gradlew build :komga-tray:jar

      - name: Prepare version
        id: prep
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "jar=komga/build/libs/komga-${VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Verify jar contents
        run: |
          JAR='${{ steps.prep.outputs.jar }}'
          test -f "$JAR" || { echo "jar not found: $JAR"; exit 1; }
          unzip -l "$JAR" > jar-listing.txt
          for entry in 'BOOT-INF/classes/public/index.html' 'BOOT-INF/classes/application.yml'; do
            grep -q "$entry" jar-listing.txt || { echo "missing jar entry: $entry"; exit 1; }
          done
          echo "jar OK ($(du -h "$JAR" | cut -f1))"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: komga-${{ steps.prep.outputs.version }}-jar
          path: ${{ steps.prep.outputs.jar }}
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: komga/build/test-results/
          if-no-files-found: ignore
