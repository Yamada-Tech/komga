name: Test Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-2404

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '18'

    - name: Build with Gradle
      run: ./gradlew build